services:
  # Pour ajouter un 2ᵉ client sur cette même machine (comme "Client 1 + Client 2" sur
  # le même FO dans le schéma officiel) : duplique ce bloc "monarcfoapp" en le
  # renommant (ex: monarcfoapp_client2), avec son propre container_name, ses propres
  # DOMAIN_FO/DBNAME_CLI/DBUSER_MONARC dans .env, et des noms de routeurs Traefik
  # uniques dans les labels (ex: "monarcfo-client2" au lieu de "monarcfo").
  monarcfoapp:
    image: ${MONARC_IMAGE:-ghcr.io/asinbenin/monarcappfo:master-asin}
    container_name: monarc-fo-app
    restart: unless-stopped
    environment:
      DBHOST: ${DBHOST:-host.docker.internal}
      DBNAME_COMMON: ${DBNAME_COMMON}
      DBNAME_CLI: ${DBNAME_CLI}
      DBUSER_MONARC: ${DBUSER_MONARC}
      DBPASSWORD_MONARC: ${DBPASSWORD_MONARC}
      DBPASSWORD_ADMIN: ${DBPASSWORD_ADMIN}
      USE_BO_COMMON: ${USE_BO_COMMON:-0}
      PDF_CONVERTER_BINARY: ${PDF_CONVERTER_BINARY:-/usr/bin/soffice}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      TRUSTEDX_URL: ${TRUSTEDX_URL}
      TRUSTEDX_CLIENT_ID: ${TRUSTEDX_CLIENT_ID}
      TRUSTEDX_CLIENT_SECRET: ${TRUSTEDX_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MONARC_SSO_ENCRYPTION_KEY: ${MONARC_SSO_ENCRYPTION_KEY}
      APP_ENV: production
      APP_DIR: /var/www/html/monarc
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monarc-network
    volumes:
      - app_data:/var/www/html/monarc/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monarcfo.rule=Host(`${DOMAIN_FO:-localhost}`)"
      - "traefik.http.routers.monarcfo.entrypoints=websecure"
      - "traefik.http.routers.monarcfo.tls.certresolver=letsencrypt"
      - "traefik.http.services.monarcfo.loadbalancer.server.port=80"
      - "traefik.http.routers.monarcfo-http.rule=Host(`${DOMAIN_FO:-localhost}`)"
      - "traefik.http.routers.monarcfo-http.entrypoints=web"
      - "traefik.http.routers.monarcfo-http.middlewares=redirect-https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"

  traefik:
    # Épinglé en v2.11 (et non v3.x) : sur Docker Engine >= 29 (API 1.55, très
    # récent), le client Docker embarqué dans Traefik v3.1/v3.5 échoue avec
    # "API returned a 400 (Bad Request)" lors de la négociation de version —
    # confirmé/isolé pendant les tests. v2.11 négocie correctement. Voir §6 du
    # guide de déploiement si ce comportement doit être revérifié sur la VM.
    image: traefik:v2.11
    container_name: monarc-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Fournisseur de routes statiques : dossier vide pour l'instant. Le jour où un
      # FO tourne sur une autre machine, on ajoute juste un fichier .yml ici (voir
      # ./traefik/dynamic/README.md) — aucun changement sur ce conteneur Traefik.
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - monarc-network

networks:
  monarc-network:
    name: ${MONARC_NETWORK_NAME:-monarc-network}

volumes:
  app_data:
  traefik_certs:

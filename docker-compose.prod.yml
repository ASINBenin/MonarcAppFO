services:
  fodb:
    image: mariadb:10.11
    container_name: monarc-fo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DBPASSWORD_ADMIN}
      MYSQL_DATABASE: ${DBNAME_COMMON}
      MYSQL_USER: ${DBUSER_MONARC}
      MYSQL_PASSWORD: ${DBPASSWORD_MONARC}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - monarc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DBPASSWORD_ADMIN}"]
      interval: 10s
      timeout: 5s
      retries: 5

  monarcfoapp:
    image: ${MONARC_IMAGE:-ghcr.io/asinbenin/monarcappfo:master-asin}
    container_name: monarc-fo-app
    restart: unless-stopped
    environment:
      DBHOST: fodb
      DBNAME_COMMON: ${DBNAME_COMMON}
      DBNAME_CLI: ${DBNAME_CLI}
      DBUSER_MONARC: ${DBUSER_MONARC}
      DBPASSWORD_MONARC: ${DBPASSWORD_MONARC}
      DBPASSWORD_ADMIN: ${DBPASSWORD_ADMIN}
      USE_BO_COMMON: ${USE_BO_COMMON:-0}
      PDF_CONVERTER_BINARY: ${PDF_CONVERTER_BINARY:-/usr/bin/soffice}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      TRUSTEDX_URL: ${TRUSTEDX_URL}
      TRUSTEDX_CLIENT_ID: ${TRUSTEDX_CLIENT_ID}
      TRUSTEDX_CLIENT_SECRET: ${TRUSTEDX_CLIENT_SECRET}
      MONARC_SSO_ENCRYPTION_KEY: ${MONARC_SSO_ENCRYPTION_KEY}
      APP_ENV: production
      APP_DIR: /var/www/html/monarc
    ports:
      - "${APP_PORT_HOST:-80}:80"
    depends_on:
      fodb:
        condition: service_healthy
    networks:
      - monarc-network
    volumes:
      - app_data:/var/www/html/monarc/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  monarc-network:
    name: ${MONARC_NETWORK_NAME:-monarc-network}

volumes:
  db_data:
  app_data:
